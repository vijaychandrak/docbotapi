# ============================================
# DocBot Production Configuration
# ============================================
# Activate with: --spring.profiles.active=prod

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================
# SSL/TLS Configuration (Optional but recommended)
# ============================================
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH:/etc/ssl/keystore.p12}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat
# server.ssl.protocol=TLS
# server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ============================================
# Database Configuration (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require&application_name=docbot-api
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# Connection Pool - Production Optimized
# ============================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# ============================================
# JPA/Hibernate Configuration - Production
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# ============================================
# Query Timeout Configuration
# ============================================
spring.jpa.properties.hibernate.dialect.postgresql.default_transaction_isolation=READ_COMMITTED
spring.jpa.properties.javax.persistence.query.timeout=30000

# ============================================
# Flyway Configuration - Production
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# ============================================
# Actuator - Production Monitoring
# ============================================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.path-mapping.health=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.threshold=1GB
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.export.prometheus.enabled=true

# ============================================
# Logging Configuration - Production
# ============================================
logging.level.root=WARN
logging.level.com.docbot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data=WARN
logging.level.org.springframework.boot.actuate=INFO
logging.file.name=/var/log/docbot/application.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ============================================
# File Upload Configuration - Production
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ============================================
# Google ADK Configuration
# ============================================
google.adk.model=${GOOGLE_ADK_MODEL}
google.adk.api-key=${GOOGLE_API_KEY}

# ============================================
# JWT Configuration - Production
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================
# Security Headers - CORS
# ============================================
# Configure in SecurityConfig.java for production
