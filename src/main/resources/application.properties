# Server
server.port=8080

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET:docbot-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# H2 Database (dev) - replace with PostgreSQL/MySQL for production
spring.datasource.url=jdbc:h2:mem:docbotdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Google ADK Configuration
google.adk.model=${GOOGLE_ADK_MODEL:gemini-2.0-flash}
google.adk.api-key=${GOOGLE_API_KEY:}

# DevTools - auto restart on file change
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true